# APK Android installable, construit par GitHub Actions (20/10/2026).
#
# Quand : à la main (onglet Actions → « APK Android » → Run workflow), ou à
# chaque tag v* (v0.3.0…), qui publie aussi l'APK dans une Release.
# Pas à chaque push : une construction prend 15 à 25 minutes de CI, et quatre
# développeurs poussent sur ce dépôt.
#
# Ce qui sort : un APK « release » signé avec la clé de debug du modèle Expo.
# Il s'installe sur n'importe quel Android (sources inconnues autorisées) :
# c'est le bon format pour les testeurs, pas pour le Play Store, qui demandera
# une clé d'envoi gardée dans les secrets du dépôt (voir .research/04-DECISIONS).

name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances (espaces de travail npm)
        run: npm ci

      - name: Vérifications (types et lint)
        working-directory: apps/mobile
        run: |
          npx tsc --noEmit -p .
          npx eslint . --max-warnings=0

      - name: Tests du contrat partagé (statistiques, démo, événements)
        run: npm test --workspace packages/contract

      - name: Projet Android natif (prebuild Expo)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Mémoire Gradle et architectures des téléphones
        working-directory: apps/mobile/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "reactNativeArchitectures=arm64-v8a,armeabi-v7a" >> gradle.properties

      - name: Construire l'APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Nommer l'APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          name="boxing-center-${GITHUB_REF_NAME//\//-}-${short}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publier dans une Release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apk
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
